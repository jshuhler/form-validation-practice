<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Form Validation</title>
</head>
<body>
    <form novalidate>
        <p class="email">
            <label for="email">Email:
                <input type="email" id="email" name="email" required minlength="9">
                <span id="email-error" class="error" aria-live="polite"></span>
            </label>
        </p>
            
        <p class="country">
            <label for="country">Country:
                <select name="country" id="country" required>
                    <option value="ch">Switzerland</option>
                    <option value="fr">France</option>
                    <option value="de">Germany</option>
                    <option value="nl">Netherlands</option>
                </select>
            </label>
        </p>
        
        <p class="postal-code">
            <label for="postal-code">Postal code:
                <input type="text" id="postal-code" name="postal-code" required>
                <span id="postal-error" class="error" aria-live="polite"></span>
            </label>
        </p>

        <p class="password">
            <label for="password">Password:
                <input type="password" name="password" id="password" required>
                <span id="password-error" class="error" aria-live="polite"></span>
            </label>
        </p>

        <p class="password-confirm">
            <label for="password-confirm">Confirm your password:
                <input type="password" name="password-confirm" id="password-confirm" required>
                <span id="password-confirm-error" class="error" aria-live="polite"></span>
            </label>
        </p>
        <button class="submit-button">Submit</button>
    </form>
</body>
</html>
