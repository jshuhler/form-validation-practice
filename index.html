<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Form Validation</title>
</head>
<body>
    <form novalidate>
        <p class="email">
            <label for="email">Email (must be @fakenet.org domain):
                <input type="text" id="email" name="email" required minlength="13">
                <span id="email-error" class="error" aria-live="polite"></span>
            </label>
        </p>
            
        <p class="country">
            <label for="country">Country:
                <select name="country" id="country" required>
                    <option value="default">Choose a Country:</option>
                    <option value="canada">Canada</option>
                    <option value="mexico">Mexico</option>
                    <option value="usa">United States</option>
                </select>
            </label>
        </p>
        
        <p class="postal-code">
            <label for="postal-code">Postal code:
                <input type="text" id="postal-code" name="postal-code" required>
            </label>
        </p>

        <p class="password">
            <label for="password">Password:
                <input type="text" name="password" id="password" required>
            </label>
        </p>

        <p class="password-confirm">
            <label for="password-confirm">Confirm your password:
                <input type="text" name="password-confirm" id="password-confirm" required>
            </label>
        </p>
        <button class="submit-button">Submit</button>
    </form>
</body>
</html>
